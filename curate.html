<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Curate Animations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a1e;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }
    #status {
      color: #999;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    #toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    button {
      background: #2a2a2e;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background: #35353a;
    }
    #filter {
      background: #2a2a2e;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      flex: 1;
      min-width: 160px;
    }
    #count {
      margin-left: auto;
      color: #999;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    #list {
      border: 1px solid #333;
      border-radius: 8px;
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .clip-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-bottom: 1px solid #2a2a2e;
      font-size: 0.92rem;
    }
    .clip-row:last-child {
      border-bottom: none;
    }
    .clip-row:hover {
      background: #232327;
    }
    .clip-row input {
      flex-shrink: 0;
    }
    .clip-row label {
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    .clip-row.hidden {
      display: none;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: #111113;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      height: 140px;
      resize: vertical;
    }
    #copy-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }
    #copy-feedback {
      color: #6bcf7a;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #copy-feedback.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Curate Animations</h1>
    <div id="status">Loading assets/novabeast.glb…</div>

    <div id="toolbar">
      <button id="select-all">Select all</button>
      <button id="select-none">Select none</button>
      <input id="filter" type="text" placeholder="Filter by name…" />
      <span id="count"></span>
    </div>

    <div id="list"></div>

    <div>
      <label for="output">Kept animation names (one per line — paste into a --keep-file):</label>
      <textarea id="output" readonly></textarea>
      <div id="copy-row">
        <button id="copy-btn">Copy to clipboard</button>
        <span id="copy-feedback">Copied!</span>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./curate.js"></script>
</body>
</html>
