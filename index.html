<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Novabeast Avatar Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1e;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #viewer-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ccc;
      font-size: 1.1rem;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #ddd;
      background: rgba(0,0,0,0.45);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">Loading avatar…</div>
  <div id="hud">
    Drag: rotate &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Right-drag: pan
  </div>
  <canvas id="viewer-canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
