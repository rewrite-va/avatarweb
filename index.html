<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Novabeast Avatar Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1e;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #viewer-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ccc;
      font-size: 1.1rem;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 26px;
      color: #ddd;
      background: rgba(0,0,0,0.45);
      padding: 16px 26px;
      border-radius: 14px;
      font-size: 1.15rem;
      line-height: 1.4;
      pointer-events: none;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .hud-item svg {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      stroke: #ddd;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #controls-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #ddd;
      background: rgba(0,0,0,0.45);
      padding: 16px 22px;
      border-radius: 14px;
      font-size: 1.15rem;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-switch {
      position: relative;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
      background: #555;
      border-radius: 13px;
      transition: background 0.15s ease;
    }
    .toggle-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #eee;
      border-radius: 50%;
      transition: left 0.15s ease;
    }
    .toggle-row input {
      display: none;
    }
    .toggle-row input:checked + .toggle-switch {
      background: #3a9a5c;
    }
    .toggle-row input:checked + .toggle-switch::after {
      left: 23px;
    }
    #pose-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }
    #pose-select {
      background: #2a2a2e;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 1rem;
      font-family: inherit;
    }
    #pose-row.hidden {
      display: none;
    }
    #keep-pose-btn {
      background: #2a2a2e;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }
    #keep-pose-btn {
      background: #2f6b40;
      border-color: #3a9a5c;
    }
    #keep-pose-btn:hover {
      background: #368049;
    }
    #discard-pose-btn:hover {
      background: #3a2e2e;
    }
    #keep-pose-btn.hidden, #discard-pose-btn.hidden, #curate-panel.hidden {
      display: none;
    }
    #curate-panel {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #444;
    }
    #curate-panel h3 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    #kept-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    #kept-list div {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
    }
    #kept-list button {
      background: none;
      border: none;
      color: #e08080;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 4px;
    }
    #curate-panel textarea {
      width: 100%;
      box-sizing: border-box;
      background: #111113;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      height: 80px;
      resize: vertical;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading avatar…</div>
  <div id="controls-panel">
    <label class="toggle-row">
      <input type="checkbox" id="clothing-toggle" />
      <span class="toggle-switch"></span>
      Clothing
    </label>
    <div id="pose-row" class="hidden">
      <label for="pose-select">Pose</label>
      <select id="pose-select"></select>
      <button id="keep-pose-btn" class="hidden">Keep &amp; next</button>
      <button id="discard-pose-btn" class="hidden">Discard &amp; next</button>
    </div>
    <div id="curate-panel" class="hidden">
      <h3>Kept poses (<span id="kept-count">0</span>)</h3>
      <div id="kept-list"></div>
      <textarea id="kept-output" readonly></textarea>
      <button id="copy-kept-btn">Copy to clipboard</button>
    </div>
  </div>
  <div id="hud">
    <span class="hud-item">
      <svg viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="16" rx="5" />
        <line x1="12" y1="2.5" x2="12" y2="9.5" />
        <path d="M12 3.3H9.8A2.8 2.8 0 0 0 7 6.1v3.4h5z" fill="#ff5a7a" stroke="none" />
      </svg>
      Drag: rotate
    </span>
    <span class="hud-item">
      <svg viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="16" rx="5" />
        <line x1="12" y1="2.5" x2="12" y2="8.5" />
        <circle cx="12" cy="7.3" r="1.15" fill="#ddd" stroke="none" />
        <path d="M9.5 20.5l2.5 2 2.5-2" />
      </svg>
      Scroll: zoom
    </span>
    <span class="hud-item">
      <svg viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="16" rx="5" />
        <line x1="12" y1="2.5" x2="12" y2="9.5" />
        <path d="M12 3.3h2.2A2.8 2.8 0 0 1 17 6.1v3.4h-5z" fill="#ff5a7a" stroke="none" />
      </svg>
      Right-drag: pan
    </span>
  </div>
  <canvas id="viewer-canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
