<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Novabeast Avatar Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1e;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #viewer-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ccc;
      font-size: 1.1rem;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 26px;
      color: #ddd;
      background: rgba(0,0,0,0.45);
      padding: 16px 26px;
      border-radius: 14px;
      font-size: 1.15rem;
      line-height: 1.4;
      pointer-events: none;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .hud-item svg {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      stroke: #ddd;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div id="loading">Loading avatar…</div>
  <div id="hud">
    <span class="hud-item">
      <svg viewBox="0 0 24 24">
        <path d="M4 8a8 8 0 0 1 13-5.2" />
        <path d="M20 16a8 8 0 0 1-13 5.2" />
        <path d="M17.2 2.6l1.4 4.4-4.5-1z" fill="#ddd" stroke="none" />
        <path d="M6.8 21.4l-1.4-4.4 4.5 1z" fill="#ddd" stroke="none" />
      </svg>
      Drag: rotate
    </span>
    <span class="hud-item">
      <svg viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="16" rx="5" />
        <line x1="12" y1="2.5" x2="12" y2="8.5" />
        <circle cx="12" cy="7.3" r="1.15" fill="#ddd" stroke="none" />
        <path d="M9.5 20.5l2.5 2 2.5-2" />
      </svg>
      Scroll: zoom
    </span>
    <span class="hud-item">
      <svg viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="16" rx="5" />
        <line x1="12" y1="2.5" x2="12" y2="9.5" />
        <path d="M12 3.3h2.2A2.8 2.8 0 0 1 17 6.1v3.4h-5z" fill="#ff5a7a" stroke="none" />
      </svg>
      Right-drag: pan
    </span>
  </div>
  <canvas id="viewer-canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
